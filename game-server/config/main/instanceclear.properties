# =============================================================================
# Dungeon speedrun clear-time tracking
# =============================================================================
#
# Maps each dungeon (world map / instance location id) to the id(s) of the boss
# NPC whose death ends the run timer.
#
# Format:
#   instanceclear.bosses = mapId:bossId[,bossId...];mapId:bossId[,bossId...]
#
# - Entries are separated by ';'
# - A mapId may have several boss ids, separated by ','
#   (the timer is recorded when the LAST of them dies; unspawned ones are ignored,
#    so either/or final bosses work too)
# - Adjust the boss ids to match your spawn data!
#
# mapId -> Dungeon
# 300040000 -> Dark Poeta
# 300100000 -> Steel Rake
# 300150000 -> Udas Temple
# 300160000 -> Lower Udas Temple
# 300200000 -> Haramel
# 320100000 -> Fire Temple
# 300170000 -> Beshmundir Temple
# 310050000 -> Aetherogenetics Lab
# 310110000 -> Theobomos Lab
# 300190000 -> Taloc's Hollow
# 320110000 -> Alquimia Research Center
# 320130000 -> Adma Stronghold
# 320150000 -> Padmarashka's Cave
# 300230000 -> Kromede's Trial
# 320120000 -> Shadow Court
# =============================================================================

instanceclear.bosses = 300040000:214904;300100000:215054;300150000:215793;300160000:215795;300200000:216922;320100000:212846;300170000:216247;310050000:212211;310110000:214669;300190000:215488;320110000:214028;320130000:214696;320150000:218756;300230000:214621
