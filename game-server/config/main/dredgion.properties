# ----------------------------
# Dredgion config's:
# ----------------------------

# Enable Dredgion 2 instance
# Default: true
gameserver.dredgion2.enable = true

# Dredgion registration time
# Default: 120 min
gameserver.dredgion.timer = 120

# Dredgion 2
# Start Times
gameserver.dredgion.time = 0 0 18,22 ? * *

# Minimum players per race (Asmodians / Elyos) required to start the Dredgion.
# Set to 1 to allow 1v1, 2 for 2v2, etc. Default: 1
gameserver.dredgion.min.team.size = 1

# Maximum players per race allowed in the Dredgion (balanced team cap). Default: 6
gameserver.dredgion.max.team.size = 6

